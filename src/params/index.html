<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title></title>
    <style>
      body {
        margin: 0;
        background: Canvas;
        color: CanvasText;
        font-family: 'Inter var', sans-serif;
      }

      .params-root {
        margin: 0 auto;
        display: flex;
        height: 100vh;
        width: 100%;
        max-width: 48rem;
        flex-direction: column;
      }

      .params-nav {
        margin-bottom: 1rem;
        display: flex;
        align-items: center;
        border-bottom: 1px solid rgba(127, 127, 127, 0.3);
        padding: 1rem;
      }

      .params-logo {
        width: 2rem;
        height: 2rem;
      }

      .params-title {
        margin-left: 1rem;
        font-size: 1.125rem;
        font-weight: 600;
      }

      .params-content {
        flex: 1;
        overflow: auto;
        padding: 0 1rem 1rem;
      }

      .params-description {
        margin: 1rem 0;
        opacity: 0.8;
      }

      .params-card {
        margin-bottom: 1rem;
        border-radius: 0.75rem;
        border: 1px solid rgba(127, 127, 127, 0.35);
        background: rgba(127, 127, 127, 0.06);
      }

      .params-card-header {
        padding: 1rem 1rem 0;
      }

      .params-workflow-name {
        margin: 0;
        font-weight: 600;
      }

      .params-workflow-description {
        margin: 0.25rem 0 0;
        opacity: 0.75;
      }

      .params-block-note {
        margin: 0.5rem 1rem 0;
      }

      .params-list {
        padding: 1rem;
      }

      .params-item {
        margin-bottom: 1rem;
      }

      .params-label {
        display: block;
        margin-bottom: 0.35rem;
      }

      .params-input {
        width: 100%;
        border: 1px solid rgba(127, 127, 127, 0.35);
        border-radius: 0.5rem;
        padding: 0.5rem 0.75rem;
        background: Canvas;
        color: CanvasText;
        box-sizing: border-box;
      }

      .params-checkbox-label {
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }

      .params-help {
        margin: 0.5rem 0 0;
        font-size: 0.875rem;
        opacity: 0.75;
      }

      .params-actions {
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }

      .params-time {
        margin: 0;
        font-size: 0.875rem;
        opacity: 0.75;
      }

      .params-spacer {
        flex: 1;
      }

      .params-btn {
        border: 1px solid rgba(127, 127, 127, 0.5);
        border-radius: 0.5rem;
        background: transparent;
        color: CanvasText;
        padding: 0.4rem 0.8rem;
        cursor: pointer;
      }

      .params-btn-primary {
        border-color: #5f3dc4;
        background: #5f3dc4;
        color: #fff;
      }

      .params-btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .params-loading {
        padding: 1rem;
      }
    </style>
  </head>

  <body>
    <div id="app" class="scroll"></div>
  </body>
</html>
